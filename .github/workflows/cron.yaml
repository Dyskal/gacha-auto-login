name: Daily Check-In

on:
  schedule:
    - cron: '47 16 * * *' # Runs every day at 16:47 UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  check-in:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Auto Login
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: bun run start
